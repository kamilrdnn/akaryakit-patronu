name: APK derle ve yayınla

# main dalına her gönderimde:
#   1) sürüm numarasını otomatik artırır (v1.0.1, v1.0.2, ...)
#   2) imzalı release APK derler
#   3) GitHub Releases'a yükler
#   4) update.json dosyasını repoya yazar → oyun içindeki "Güncelleme var" ekranı bunu okur
on:
  push:
    branches: [main]
    paths-ignore:
      - 'update.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: akaryakit-derleme
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Sürüm numarasını belirle
        id: surum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          son=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' 2>/dev/null \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [ -z "$son" ]; then
            yeni="1.2.0"
          else
            IFS=. read -r buyuk kucuk yama <<< "$son"
            yeni="$buyuk.$kucuk.$((yama + 1))"
          fi
          # elle kurulan sürümlerin (1.0, 1.1) altında kalmasın
          taban="1.2.0"
          if [ "$(printf '%s\n%s\n' "$yeni" "$taban" | sort -V | head -n1)" != "$taban" ]; then
            yeni="$taban"
          fi
          echo "Yeni sürüm: v$yeni (kod ${GITHUB_RUN_NUMBER})"
          echo "ad=$yeni" >> "$GITHUB_OUTPUT"
          echo "kod=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret'ı eksik. Repo > Settings > Secrets and variables > Actions'a ekle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/akaryakit.jks"
          ls -l "$RUNNER_TEMP/akaryakit.jks"

      - name: Release APK derle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/akaryakit.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.surum.outputs.kod }}
          APP_VERSION_NAME: ${{ steps.surum.outputs.ad }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          else gradle :app:assembleRelease :app:bundleRelease --no-daemon; fi

      - name: APK'yı adlandır
        id: apk
        run: |
          mkdir -p cikti
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AD="AkaryakitPatronu-${{ steps.surum.outputs.ad }}.apk"
          cp "$APK" "cikti/$AD"
          echo "ad=$AD" >> "$GITHUB_OUTPUT"
          echo "boyut=$(stat -c%s "cikti/$AD")" >> "$GITHUB_OUTPUT"
          AAB=$(find app/build/outputs/bundle -name '*.aab' | head -1 || true)
          if [ -n "$AAB" ]; then
            AAD="AkaryakitPatronu-${{ steps.surum.outputs.ad }}.aab"
            cp "$AAB" "cikti/$AAD"
            echo "aab=$AAD" >> "$GITHUB_OUTPUT"
          fi
          ls -l cikti

      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOT=$(git log -1 --pretty=%s | tr -d '"' | cut -c1-200)
          gh release create "v${{ steps.surum.outputs.ad }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Akaryakıt Patronu v${{ steps.surum.outputs.ad }}" \
            --notes "$NOT" \
            "cikti/${{ steps.apk.outputs.ad }}"
          if [ -n "${{ steps.apk.outputs.aab }}" ]; then
            gh release upload "v${{ steps.surum.outputs.ad }}" "cikti/${{ steps.apk.outputs.aab }}" --repo "$GITHUB_REPOSITORY" --clobber || true
          fi

      - name: update.json yaz (oyun içi güncelleme)
        run: |
          NOT=$(git log -1 --pretty=%s | tr -d '"\\' | cut -c1-200)
          cat > update.json <<JSON
          {
            "versionCode": ${{ steps.surum.outputs.kod }},
            "versionName": "${{ steps.surum.outputs.ad }}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.surum.outputs.ad }}/${{ steps.apk.outputs.ad }}",
            "size": ${{ steps.apk.outputs.boyut }},
            "notes": "${NOT}"
          }
          JSON
          cat update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Sürüm v${{ steps.surum.outputs.ad }} [skip ci]" || exit 0
          git push

      - name: APK'yı iş çıktısı olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: akaryakit-paket-${{ steps.surum.outputs.ad }}
          path: |
            cikti/*.apk
            cikti/*.aab
